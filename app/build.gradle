plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.iptvbox'
    compileSdk 33

    defaultConfig {
        applicationId 'com.example.iptvbox'
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 仅依赖 AndroidX 基础库；播放交给本机已安装的 VLC，无需内嵌庞大引擎
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
